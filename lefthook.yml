pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{ts,tsx,js,jsx}"
      run: npx biome check --write {staged_files}
      stage_fixed: true
    typecheck:
      run: npx tsc --noEmit -p tsconfig.typecheck.json
    typecheck-panel:
      run: npx tsc --noEmit -p panel/tsconfig.json

pre-push:
  parallel: true
  commands:
    test:
      run: npm test

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}
