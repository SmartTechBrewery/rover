name: Verify

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # verify is lint, typecheck and the unit suite. The device suite is deliberately not
      # here: no runner has a device attached, so it would skip itself and report green
      # while asserting nothing — a gate that looks stricter than it is.
      - run: npm run verify
